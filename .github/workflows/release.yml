concurrency:
  cancel-in-progress: false
  group: odincuda-release
  queue: max
jobs:
  build:
    env:
      VERSION: ${{ needs.version.outputs.version }}
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.released != 'true'
    needs:
    - version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: 验证版本元数据
      run: python3 -m unittest discover -s tests -p "test_release_version.py" -v
    - name: 写入发布版本
      run: python3 .github/scripts/set-version.py "$VERSION"
    - name: 检查安装脚本语法
      run: bash -n script/install_ros1.sh script/install_ros2.sh script/build_ros.sh script/build_ros2.sh script/download_vendor_sdk.sh
    - name: 打包源码
      run: 'mkdir -p "$RUNNER_TEMP/package" "$RUNNER_TEMP/release"

        git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/package"

        (cd "$RUNNER_TEMP/package" && zip -qr "$RUNNER_TEMP/release/odincuda_${VERSION}_source.zip" .)

        '
    - uses: actions/upload-artifact@v7
      with:
        name: release-source
        path: ${{ runner.temp }}/release/*.zip
        if-no-files-found: error
        retention-days: 7
        overwrite: true
  release:
    env:
      PRODUCT_NAME: OdinCUDA
      RELEASE_ASSETS: odincuda_${{ needs.version.outputs.version }}_source.zip SHA256SUMS
      RELEASE_IMAGES: ''
      VERSION: ${{ needs.version.outputs.version }}
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.skip != 'true' && (needs.build.result
      == 'success' || (needs.build.result == 'skipped' && needs.version.outputs.released == 'true')) }}
    name: 发布 GitHub Release
    needs:
    - version
    - build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - env:
        GH_TOKEN: ${{ github.token }}
      id: state
      name: 检查当前 Release 状态
      run: python3 .github/scripts/state.py
    - if: steps.state.outputs.released != 'true'
      name: 下载构建产物
      uses: actions/download-artifact@v7
      with:
        merge-multiple: true
        path: dist
        pattern: release-*
    - if: steps.state.outputs.released != 'true'
      name: 生成校验和
      run: 'set -euo pipefail

        (cd dist && sha256sum -- * > SHA256SUMS)

        '
    - env:
        GH_TOKEN: ${{ github.token }}
      id: publish
      name: 发布或恢复 Release
      run: python3 .github/scripts/publish.py
  version:
    name: 自动编号
    outputs:
      released: ${{ steps.number.outputs.released }}
      skip: ${{ steps.number.outputs.skip }}
      version: ${{ steps.number.outputs.version }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - env:
        GH_TOKEN: ${{ github.token }}
      id: number
      name: 计算版本并创建标签
      run: 'test "$GITHUB_REF" = refs/heads/main

        python3 .github/scripts/version.py

        '
name: 自动发布 OdinCUDA
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: write
